---
- name: Provision Proxmox VE LXC Container 108 (Ubuntu 24.04) & Deploy Fragment
  hosts: proxmox_hosts
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  tasks:
    # -------------------------------------------------------------
    # 1. PROXMOX HOST: UBUNTU 24.04 TEMPLATE & LXC 108 PROVISIONING
    # -------------------------------------------------------------
    - name: 1.1 Ensure Ubuntu 24.04 LXC template is downloaded on Proxmox host
      ansible.builtin.shell: |
        pveam update
        if ! pveam list local | grep -q "ubuntu-24.04"; then
          TEMPLATE_NAME=$(pveam available | grep "ubuntu-24.04" | head -n1 | awk '{print $2}')
          pveam download local "$TEMPLATE_NAME"
        fi
        UBUNTU_TMPL=$(pveam list local | grep "ubuntu-24.04" | head -n1 | awk '{print $1}')
        echo "FOUND_TEMPLATE=$UBUNTU_TMPL"
      register: template_check
      changed_when: false

    - name: 1.2 Set resolved template variable
      ansible.builtin.set_fact:
        resolved_template: "{{ template_check.stdout | regex_search('FOUND_TEMPLATE=(.*)', '\\1') | first }}"

    - name: 1.3 Debug resolved Ubuntu 24.04 template
      ansible.builtin.debug:
        msg: "Using Ubuntu 24.04 LXC template: {{ resolved_template }}"

    - name: 1.4 Check CT {{ app_vmid }} ({{ app_hostname }}) status
      ansible.builtin.command: pct status {{ app_vmid }}
      register: app_status
      failed_when: false
      changed_when: false

    - name: 1.5 Create CT {{ app_vmid }} ({{ app_hostname }}) if not exists
      ansible.builtin.command: >
        pct create {{ app_vmid }} {{ resolved_template }}
        --hostname {{ app_hostname }}
        --cores {{ app_cores }}
        --memory {{ app_ram }}
        --swap 512
        --net0 name=eth0,bridge={{ net_bridge }},ip={{ app_ip }}/{{ subnet_mask }},gw={{ gateway_ip }}
        --nameserver "{{ dns_servers | default('1.1.1.1 8.8.8.8') }}"
        --storage {{ storage_pool }}
        --rootfs {{ storage_pool }}:{{ app_disk }}
        --unprivileged 1
        --onboot 1
      when: app_status.rc != 0

    - name: 1.6 Ensure CT {{ app_vmid }} network and resource configuration
      ansible.builtin.command: >
        pct set {{ app_vmid }}
        --hostname {{ app_hostname }}
        --cores {{ app_cores }}
        --memory {{ app_ram }}
        --swap 512
        --net0 name=eth0,bridge={{ net_bridge }},ip={{ app_ip }}/{{ subnet_mask }},gw={{ gateway_ip }}
        --nameserver "{{ dns_servers | default('1.1.1.1 8.8.8.8') }}"
        --onboot 1
      when: app_status.rc == 0

    - name: 1.7 Start CT {{ app_vmid }} if not running
      ansible.builtin.command: pct start {{ app_vmid }}
      when: "app_status.rc != 0 or 'status: stopped' in app_status.stdout"

    - name: 1.8 Wait for container networking to initialize
      ansible.builtin.pause:
        seconds: 8

    - name: 1.9 Ensure DNS and network route are active inside CT {{ app_vmid }}
      ansible.builtin.shell: |
        pct exec {{ app_vmid }} -- bash -c "
        if ! grep -q 'nameserver' /etc/resolv.conf 2>/dev/null; then
          echo 'nameserver 1.1.1.1' > /etc/resolv.conf
          echo 'nameserver 8.8.8.8' >> /etc/resolv.conf
        fi;
        ip route show default | grep -q default || ip route add default via {{ gateway_ip }} dev eth0
        "

    # -------------------------------------------------------------
    # 2. CT 108: UBUNTU 24.04 PACKAGES, RUNTIME & DIRECTORIES
    # -------------------------------------------------------------
    - name: 2.1 Update apt packages inside CT {{ app_vmid }}
      ansible.builtin.command: pct exec {{ app_vmid }} -- env DEBIAN_FRONTEND=noninteractive apt-get update

    - name: 2.2 Install build tools, Erlang, SQLite, Nginx, and utilities inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- env DEBIAN_FRONTEND=noninteractive apt-get install -y
        git build-essential ca-certificates openssl curl unzip sqlite3 libsqlite3-dev
        nginx erlang-base erlang-dev erlang-xmerl erlang-parsetools erlang-tools
        erlang-runtime-tools erlang-ssl erlang-crypto erlang-inets sudo python3 locales

    - name: 2.2b Configure UTF-8 locale inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "locale-gen en_US.UTF-8 && update-locale LANG=en_US.UTF-8"

    - name: 2.3 Ensure Elixir 1.17+ is installed inside CT {{ app_vmid }}
      ansible.builtin.shell: |
        pct exec {{ app_vmid }} -- bash -c "
        if ! elixir --version 2>/dev/null | grep -q 'Elixir 1.17'; then
          OTP_REL=\$(erl -noshell -eval 'io:format(\"~s\", [erlang:system_info(otp_release)]), halt().')
          curl -sSL -o /tmp/elixir.zip \"https://github.com/elixir-lang/elixir/releases/download/v1.17.3/elixir-otp-\${OTP_REL}.zip\" &&
          unzip -qo /tmp/elixir.zip -d /usr/local &&
          chmod -R +x /usr/local/bin /usr/local/lib &&
          ln -sf /usr/local/bin/elixir /usr/bin/elixir &&
          ln -sf /usr/local/bin/elixirc /usr/bin/elixirc &&
          ln -sf /usr/local/bin/iex /usr/bin/iex &&
          ln -sf /usr/local/bin/mix /usr/bin/mix &&
          rm -f /tmp/elixir.zip
        fi"

    - name: 2.4 Install Hex and Rebar inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && mix local.hex --force && mix local.rebar --force"

    - name: 2.5 Create system user {{ app_user }} inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "id -u {{ app_user }} &>/dev/null || useradd -r -s /bin/bash {{ app_user }}"

    - name: 2.6 Create application and SQLite data directories inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "mkdir -p {{ app_dir }} /etc/fragment /var/lib/fragment {{ app_source_dir }} &&
        chown -R {{ app_user }}:{{ app_user }} {{ app_dir }} /etc/fragment /var/lib/fragment {{ app_source_dir }} &&
        chmod 750 /var/lib/fragment /etc/fragment"

    # -------------------------------------------------------------
    # 3. CODEBASE TRANSFER & PHOENIX RELEASE BUILD
    # -------------------------------------------------------------
    - name: 3.1 Copy project source code from control machine to Proxmox host
      ansible.builtin.copy:
        src: "../"
        dest: "/tmp/fragment-src-host/"
        mode: '0755'
      tags: ['deploy', 'redeploy']

    - name: 3.2 Create source archive on Proxmox host
      ansible.builtin.command: >
        tar -czf /tmp/fragment-src.tar.gz -C /tmp/fragment-src-host
        --exclude="_build" --exclude="deps" --exclude=".git" --exclude=".elixir_ls" .
      tags: ['deploy', 'redeploy']

    - name: 3.3 Push source archive into CT {{ app_vmid }}
      ansible.builtin.command: >
        pct push {{ app_vmid }} /tmp/fragment-src.tar.gz /tmp/fragment-src.tar.gz
      tags: ['deploy', 'redeploy']

    - name: 3.4 Extract source code inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "rm -rf {{ app_source_dir }} && mkdir -p {{ app_source_dir }} &&
        tar -xzf /tmp/fragment-src.tar.gz -C {{ app_source_dir }} &&
        rm -f /tmp/fragment-src.tar.gz &&
        chown -R {{ app_user }}:{{ app_user }} {{ app_source_dir }}"
      tags: ['deploy', 'redeploy']

    - name: 3.5 Render environment configuration file on host
      ansible.builtin.template:
        src: templates/fragment.env.j2
        dest: /tmp/fragment.env
        mode: '0600'
      tags: ['deploy', 'redeploy']

    - name: 3.5b Push environment configuration file into CT {{ app_vmid }}
      ansible.builtin.command: pct push {{ app_vmid }} /tmp/fragment.env {{ env_file_path }}
      tags: ['deploy', 'redeploy']

    - name: 3.6 Secure environment configuration file permissions
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "chown {{ app_user }}:{{ app_user }} {{ env_file_path }} && chmod 600 {{ env_file_path }}"
      tags: ['deploy', 'redeploy']

    - name: 3.7 Stop fragment service before rebuild (if active)
      ansible.builtin.command: pct exec {{ app_vmid }} -- systemctl stop fragment
      failed_when: false
      changed_when: true
      tags: ['deploy', 'redeploy']

    - name: 3.8 Fetch Mix dependencies in prod environment inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && cd {{ app_source_dir }} && MIX_ENV=prod mix deps.get --only prod"
      tags: ['deploy', 'redeploy']

    - name: 3.9 Compile dependencies in prod environment inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && cd {{ app_source_dir }} && MIX_ENV=prod mix deps.compile"
      tags: ['deploy', 'redeploy']

    - name: 3.10 Setup and precompile static assets inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && cd {{ app_source_dir }} && MIX_ENV=prod mix assets.setup && MIX_ENV=prod mix compile && MIX_ENV=prod mix assets.deploy"
      tags: ['deploy', 'redeploy']

    - name: 3.11 Run SQLite database migrations inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && set -a && source {{ env_file_path }} && set +a && cd {{ app_source_dir }} && MIX_ENV=prod mix ecto.migrate"
      tags: ['deploy', 'redeploy']

    - name: 3.12 Build Phoenix Release into {{ app_dir }} inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "export LANG=C.UTF-8 LC_ALL=C.UTF-8 ELIXIR_ERL_OPTIONS='+fnu' && cd {{ app_source_dir }} && MIX_ENV=prod mix release --path {{ app_dir }} --overwrite"
      tags: ['deploy', 'redeploy']

    - name: 3.13 Set ownership on release and database directories
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "chown -R {{ app_user }}:{{ app_user }} {{ app_dir }} /var/lib/fragment"
      tags: ['deploy', 'redeploy']

    # -------------------------------------------------------------
    # 4. SYSTEMD SERVICE & NGINX REVERSE PROXY
    # -------------------------------------------------------------
    - name: 4.1 Render Systemd Service Unit File on host
      ansible.builtin.template:
        src: templates/fragment.service.j2
        dest: /tmp/fragment.service
        mode: '0644'
      tags: ['deploy', 'redeploy']

    - name: 4.1b Push Systemd Service Unit File into CT {{ app_vmid }}
      ansible.builtin.command: pct push {{ app_vmid }} /tmp/fragment.service /etc/systemd/system/fragment.service
      tags: ['deploy', 'redeploy']

    - name: 4.2 Enable and restart fragment.service inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "systemctl daemon-reload && systemctl enable fragment && systemctl restart fragment"
      tags: ['deploy', 'redeploy']

    - name: 4.3 Render Nginx Site Configuration on host
      ansible.builtin.template:
        src: templates/nginx_fragment.conf.j2
        dest: /tmp/nginx_fragment.conf
        mode: '0644'

    - name: 4.3b Push Nginx Site Configuration into CT {{ app_vmid }}
      ansible.builtin.command: pct push {{ app_vmid }} /tmp/nginx_fragment.conf /etc/nginx/sites-available/fragment

    - name: 4.4 Enable Nginx Site and Reload Service inside CT {{ app_vmid }}
      ansible.builtin.command: >
        pct exec {{ app_vmid }} -- bash -c "ln -sf /etc/nginx/sites-available/fragment /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx"

    - name: 4.5 Wait for fragment application to respond
      ansible.builtin.pause:
        seconds: 3
      tags: ['deploy', 'redeploy']

    - name: 4.6 Verify HTTP service endpoint
      ansible.builtin.uri:
        url: "http://{{ app_ip }}:{{ app_port }}"
        follow_redirects: none
        status_code:
          - 200
          - 301
          - 302
      register: http_check
      retries: 10
      delay: 2
      until: http_check.status in [200, 301, 302]
      tags: ['deploy', 'redeploy']

    - name: 4.7 Clean up temporary build artifacts on Proxmox host
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/fragment-src.tar.gz
        - /tmp/fragment-src-host
        - /tmp/fragment.env
        - /tmp/fragment.service
        - /tmp/nginx_fragment.conf
      tags: ['deploy', 'redeploy']

    - name: 4.8 Output Deployment Summary
      ansible.builtin.debug:
        msg:
          - "========================================================="
          - " FRAGMENT DEPLOYMENT TO LXC {{ app_vmid }} COMPLETED!"
          - "========================================================="
          - " Proxmox Host       : {{ proxmox_ip }}"
          - " Container ID / OS  : {{ app_vmid }} (Ubuntu 24.04)"
          - " Application IP     : http://{{ app_ip }}"
          - " Application Port   : {{ app_port }}"
          - " Database (SQLite)  : {{ db_path }}"
          - " Service Name       : fragment.service"
          - " HTTP Check Status  : {{ http_check.status }}"
          - "========================================================="
      tags: ['deploy', 'redeploy']
